name: ChromaLens CI

on:
  push:
    branches:
      - mvp
  pull_request:
    branches:
      - mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromalens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-base:
    name: Locked Python 3.10 base
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up exact Conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
        with:
          auto-update-conda: false
          activate-environment: lens
          environment-file: requirements/conda-win-64.lock

      - name: Validate Conda collaboration lock
        shell: pwsh
        run: |
          $lock = Get-Content requirements/conda-win-64.lock
          if ($lock -notcontains "# platform: win-64") {
            throw "Conda lock must target win-64."
          }
          if ($lock -notcontains "@EXPLICIT") {
            throw "Conda lock must use explicit artifact URLs."
          }
          $artifacts = $lock | Where-Object { $_ -and -not $_.StartsWith("#") -and $_ -ne "@EXPLICIT" }
          $pattern = '^https://repo\.anaconda\.com/pkgs/main/(?:win-64|noarch)/[^#]+#[0-9a-f]{32}$'
          $invalid = @($artifacts | Where-Object { $_ -notmatch $pattern })
          if ($invalid.Count -gt 0) {
            throw "Conda lock contains an unapproved or unhashed artifact: $($invalid -join ', ')"
          }
          if (-not ($artifacts -match '/python-3\.10\.20-hb00fc5c_1\.conda#')) {
            throw "Conda lock does not pin the approved Python 3.10.20 build."
          }
          if (-not ($artifacts -match '/pip-26\.1\.2-pyhc872135_0\.conda#')) {
            throw "Conda lock does not pin the approved pip 26.1.2 build."
          }

      - name: Verify activated bootstrap
        shell: pwsh
        run: |
          $pythonVersion = python -c "import platform; print(platform.python_version())"
          if ($pythonVersion -ne "3.10.20") {
            throw "Expected Python 3.10.20, got $pythonVersion."
          }
          $pipVersion = python -m pip --version
          if ($pipVersion -notmatch '^pip 26\.1\.2 ') {
            throw "Expected pip 26.1.2, got $pipVersion."
          }

      - name: Install hashed lock-generation tooling
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements/lock-tools-py310-win64.lock

      - name: Verify committed locks are current
        shell: pwsh
        run: |
          $env:CUSTOM_COMPILE_COMMAND = 'conda run --name lens pip-compile pyproject.toml --extra dev --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/py310-win64.lock'
          python -m piptools compile pyproject.toml --extra dev --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/py310-win64.lock

          $env:CUSTOM_COMPILE_COMMAND = 'conda run --name lens pip-compile pyproject.toml --extra lock --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/lock-tools-py310-win64.lock'
          python -m piptools compile pyproject.toml --extra lock --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/lock-tools-py310-win64.lock

          $env:CUSTOM_COMPILE_COMMAND = 'conda run --name lens pip-compile pyproject.toml --extra dev --extra segment-mediapipe --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/segment-mediapipe-py310-win64.lock'
          python -m piptools compile pyproject.toml --extra dev --extra segment-mediapipe --generate-hashes --allow-unsafe --resolver backtracking --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/segment-mediapipe-py310-win64.lock

          git diff --exit-code -- requirements/py310-win64.lock requirements/lock-tools-py310-win64.lock requirements/segment-mediapipe-py310-win64.lock

      - name: Install hashed base and development dependencies
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements/py310-win64.lock

      - name: Install ChromaLens without dependency resolution
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-build-isolation
          --no-deps
          --editable ".[dev]"

      - name: Check dependency consistency
        shell: pwsh
        run: |
          python -m pip check
          python -c "from importlib import metadata; assert metadata.version('daltonlens') == '0.1.5'; print('daltonlens=' + metadata.version('daltonlens'))"

      - name: Check hardware-independent CLI
        shell: pwsh
        run: python -m chromalens --help

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Reject forbidden artifacts and oversized tracked files
        shell: pwsh
        run: |
          $forbiddenPattern = '(^|/)(\.venv|venv|env|__pycache__|\.pytest_cache|[^/]+\.egg-info)(/|$)|(^|/)\.env(\.|$)|\.(ckpt|onnx|pb|pth|pt|safetensors|task|tflite)$'
          $trackedFiles = @(git ls-files)
          $forbidden = $trackedFiles | Select-String -Pattern $forbiddenPattern
          if ($forbidden) {
            $forbidden
            throw 'Forbidden generated, environment, model, or binary path is tracked.'
          }

          $t09ResultPattern = '^evaluation/results/README\.md$|^evaluation/results/curated/(summary\.md|(end_to_end|segmentation|color_science|performance_responsible_ai)/.+\.(csv|json|md))$'
          $forbiddenT09 = @($trackedFiles | Where-Object {
            $_ -match '^artifacts/t09/' -or
            ($_.StartsWith('evaluation/results/') -and $_ -notmatch $t09ResultPattern)
          })
          if ($forbiddenT09) {
            $forbiddenT09
            throw 'T09 raw/private/binary evidence or an unowned result path is tracked.'
          }

          $oversizedCurated = @($trackedFiles | Where-Object {
            $_ -match '^evaluation/results/curated/' -and
            (Get-Item -LiteralPath $_).Length -gt 1MB
          })
          if ($oversizedCurated) {
            $oversizedCurated
            throw 'A curated T09 result exceeds the frozen 1 MiB per-file limit.'
          }

          $largeFiles = $trackedFiles | ForEach-Object {
            if (Test-Path -LiteralPath $_) {
              $item = Get-Item -LiteralPath $_
              if ($item.Length -gt 5MB) {
                "{0}`t{1}" -f $item.Length, $_
              }
            }
          }
          if ($largeFiles) {
            $largeFiles
            throw 'A tracked file exceeds the 5 MiB collaboration gate.'
          }

  verify-mediapipe:
    name: Locked MediaPipe 0.10.21 backend
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up exact Conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
        with:
          auto-update-conda: false
          activate-environment: lens
          environment-file: requirements/conda-win-64.lock

      - name: Install hashed MediaPipe dependency closure
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements/segment-mediapipe-py310-win64.lock

      - name: Install ChromaLens without dependency resolution
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-build-isolation
          --no-deps
          --editable ".[dev,segment-mediapipe]"

      - name: Verify exact real backend runtime
        shell: pwsh
        run: |
          python -m pip check
          python -c "import mediapipe; assert mediapipe.__version__ == '0.10.21'; print('mediapipe=' + mediapipe.__version__)"
          python -c "import cv2; assert cv2.__version__ == '4.10.0'; print('opencv=' + cv2.__version__)"

      - name: Run real-backend and full test gates
        shell: pwsh
        run: |
          python -m pytest -q tests/integration/test_t02_segmentation_integration.py
          python -m pytest -q
